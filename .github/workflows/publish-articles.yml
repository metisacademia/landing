name: Publicar artigos agendados

on:
  schedule:
    # Terça e quinta, America/Recife (UTC−3). 07:55 e reforços no mesmo dia:
    # o agendador do GitHub atrasa ou descarta um horário único. Minutos 25 e
    # 55 ficam fora do pico do início da hora. O deploy não repete o commit
    # se a publicação de hoje já aconteceu.
    - cron: "55 10 * * 2,4" # 07:55
    - cron: "25 12 * * 2,4" # 09:25
    - cron: "55 14 * * 2,4" # 11:55
    - cron: "25 16 * * 2,4" # 13:25
    - cron: "55 18 * * 2,4" # 15:55
    - cron: "25 21 * * 2,4" # 18:25
  workflow_dispatch:
    inputs:
      force:
        description: Disparar o deploy mesmo sem artigo na janela
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-scheduled-articles
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 30

      - name: Ver artigos na janela
        id: due
        env:
          FORCE_PUBLISH: ${{ inputs.force }}
        run: node scripts/due-articles.mjs

      - name: Disparar o deploy de produção
        if: steps.due.outputs.due == 'true'
        run: |
          publish_subject="Publica os artigos agendados para hoje."
          today=$(TZ=America/Recife date +%F)
          if [ "${{ inputs.force }}" != "true" ] && TZ=America/Recife git log -30 --format='%s%x09%cd' --date=format-local:%F | grep -F -x "${publish_subject}	${today}" >/dev/null; then
            echo "Já existe um commit de publicação em $today (America/Recife). Horário seguinte não dispara outro deploy."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "$publish_subject"
          git push origin HEAD:main
